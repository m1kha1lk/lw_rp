name: Optimize resource pack

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  packsquash:
    name: Optimize resource pack
    runs-on: ubuntu-latest

    steps:
      # - name: Clone repository
      #   uses: actions/checkout@v4
      #   with:
      #     fetch-depth: 0

      # - name: Run PackSquash
      #   uses: ComunidadAylas/PackSquash-action@v4
      #   with:
      #     packsquash_version: v0.4.1
      #     options: .github/squash_0.4.1_with_reuse_git.toml

      # using local pack_squash
      - name: Run PackSquash
        run: |
          chmod +x .github/packsquash
          ./.github/squash_0.4.1_with_reuse_git.toml
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ github.run_number }}"

          gh release create "$VERSION" \
            /tmp/squashed_output.zip \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --generate-notes
