name: Build Resource Pack

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          mkdir build
          zip -r "build/resource-pack-${GITHUB_REF_NAME}.zip" assets pack.mcmeta pack.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/resource-pack-${{ github.ref_name }}.zip
          generate_release_notes: true